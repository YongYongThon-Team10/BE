spring:
  application:
    name: be
  config:
    # 로컬 .env 파일이 있으면 읽는다 (.env.example 참고). OS 환경변수가 항상 우선한다.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect

jwt:
  access-token:
    expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME:3600000}
  refresh-token:
    expire-time: ${JWT_REFRESH_TOKEN_EXPIRE_TIME:604800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# S5, S6 행사 데이터 출처. json(기본, 엑셀 변환 파일) 또는 postgres(팀 행사 DB, GCP IAP 터널 필요)
app:
  event-data:
    source: ${EVENT_DATA_SOURCE:json}
    db-url: ${EVENT_DB_URL:jdbc:postgresql://127.0.0.1:15432/yongin_events?sslmode=require}
    db-username: ${EVENT_DB_USERNAME:yongin_reader}
    db-password: ${EVENT_DB_PASSWORD:}
