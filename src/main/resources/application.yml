spring:
  application:
    name: be
  config:
    # 로컬 .env 파일이 있으면 읽는다 (.env.example 참고). OS 환경변수가 항상 우선한다.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect

jwt:
  access-token:
    expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME:3600000}
  refresh-token:
    expire-time: ${JWT_REFRESH_TOKEN_EXPIRE_TIME:604800000}

# E4 자연어 검색 조건 변환. 키가 없으면 E4는 502 E5021로 응답한다 (부팅은 된다)
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

ai:
  search-parse-timeout-seconds: ${AI_SEARCH_PARSE_TIMEOUT_SECONDS:15}

# E14 출발지 장소 검색. 키가 없으면 E14는 502 E5022로 응답한다 (부팅은 된다)
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  local-base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
